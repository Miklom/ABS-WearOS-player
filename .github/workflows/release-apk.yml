name: Release APK

# Manual on purpose: a release should be a deliberate act, not every push.
# The APK holds no credentials — the server and account are entered on the watch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Using the keystore from ANDROID_KEYSTORE_BASE64."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the APK is signed with a" \
                 "throwaway debug key. It installs fine, but a later release signed with a" \
                 "different key will not install over it — you would have to uninstall first."
          fi

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.tag }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION_NAME"

      - name: Name the artifact
        id: apk
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/abs-wearos-player-$TAG.apk"
          echo "path=dist/abs-wearos-player-$TAG.apk" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION_CODE: ${{ github.run_number }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          notes=$(cat <<EOF
          Pre-built Wear OS APK, version code $VERSION_CODE.

          Install with:

          \`\`\`
          adb connect <watch-ip>:5555
          adb -s <watch-ip>:5555 install -r $(basename "$APK")
          \`\`\`

          Enter your Audiobookshelf server address, username and password on the
          watch at first launch. Bluetooth headphones must be paired to the watch
          for audio.
          EOF
          )
          args=(--title "$TAG" --target "$GITHUB_SHA" --notes "$notes")
          # Not a `&&` one-liner: steps run under `bash -e`, where a false test
          # as the whole command would abort the step.
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "$APK" "${args[@]}"
